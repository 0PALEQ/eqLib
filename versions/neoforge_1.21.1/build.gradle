plugins {
    id 'eclipse'
    id 'net.neoforged.moddev' version '2.0.141'
}

if (providers.gradleProperty('eqlibBuildDir').isPresent()) {
    layout.buildDirectory = file(providers.gradleProperty('eqlibBuildDir').get())
}
version = project.mod_version
def libraryVersion = project.version.toString()
base.archivesName = project.archives_base_name

tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
    archiveVersion = "${project.mod_version}-${project.loader_name}-${project.minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()

            def mcreatorJvmOptions = System.getenv('MCREATOR_JVM_OPTIONS')
            if (mcreatorJvmOptions) {
                mcreatorJvmOptions.split("\\s+").findAll { it.trim() }.each { arg ->
                    jvmArgument(arg)
                }
            }
        }
        server {
            server()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        mcreator {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}


group = 'com.cookiecraftmods'
java { withSourcesJar() }
processResources {
    inputs.property 'libraryVersion', libraryVersion
    filesMatching(['fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand(version: libraryVersion, mod_version: libraryVersion)
    }
}
// This adapter is an internal build input; the root tooling publishes the universal distribution.

// A consumer run already loads eqlib; avoid launching a second game from the nested project.
if (project != rootProject) {
    tasks.matching { it.name in ['runClient', 'runServer', 'runData'] }.configureEach { enabled = false }
}

apply from: project.file('../../shared/gradle/adapter-sources.gradle')
