import groovy.json.JsonSlurper

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

if (providers.gradleProperty('eqlibBuildDir').isPresent()) {
    layout.buildDirectory = file(providers.gradleProperty('eqlibBuildDir').get())
}
apply from: project.file('../../shared/gradle/mod-metadata.gradle')

version = project.mod_version
def libraryVersion = project.version.toString()
def libraryMetadata = [version: libraryVersion, mod_version: libraryVersion, mod_id: project.mod_id, mod_name: project.mod_name, mod_description: project.mod_description, mod_license: project.mod_license]
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
    archiveVersion = "${project.mod_version}-${project.loader_name}-${project.minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output',
                    file('src/generated/resources/').absolutePath
            programArguments.addAll(provider {
                sourceSets.main.resources.srcDirs.collectMany { ['--existing', it.absolutePath] }
            })
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}




group = 'com.cookiecraftmods'
java { withSourcesJar() }
processResources {
    inputs.property 'libraryVersion', libraryVersion
    filesMatching(['fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand(libraryMetadata)
    }
}
// This adapter is an internal build input; the root tooling publishes the universal distribution.

// A consumer run already loads eqlib; avoid launching a second game from the nested project.
if (project != rootProject) {
    tasks.matching { it.name in ['runClient', 'runServer', 'runData'] }.configureEach { enabled = false }
}

apply from: project.file('../../shared/gradle/adapter-sources.gradle')
